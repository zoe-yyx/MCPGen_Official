
[project]
name = "wechat-article-mcp"
version = "1.0.0"
description = "Classify and Summarize WeChat Articles – MCP project converted from n8n workflow"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    "feedparser>=6.0.11",
    "notion-client>=2.2.1",
    "google-api-python-client>=2.130.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

# Uncomment below to use Alibaba Cloud PyPI mirror (recommended in China):
# [[tool.uv.index]]
# name = "aliyun"
# url = "ENDPOINT_PLACEHOLDER"
# default = true