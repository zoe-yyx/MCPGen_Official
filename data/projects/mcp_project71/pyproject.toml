[project]
name = "mcp-project71"
version = "1.0.0"
description = "Instant Ad Banner Generator via LINE, GPT prompt optimization, and AI image generation"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.11.3",
    "mcp[cli]>=1.13.0",
    "python-dotenv>=1.1.0",
    "loguru>=0.7.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]
